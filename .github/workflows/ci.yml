name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `sarnaut-pack` compiles `sarnaut.content.v1` with prost-build, which shells
  # out to protoc. Pinned to the version `server` generates its Go stubs with so
  # both sides of ADR 0029 are produced by one compiler release.
  PROTOC_VERSION: "35.1"

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Install protoc
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  fixture-pack:
    name: Fixture pack is reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The fixture is compiled from the hand-authored demo dataset. It contains
      # no MY.GAMES-derived data, so it is the one pack a public runner may build
      # and the one pack a public repository may vendor (ADR 0029).
      - name: Check out data-schemas
        uses: actions/checkout@v7
        with:
          repository: SarnautCore/data-schemas
          path: data-schemas

      - name: Install protoc
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"

      - name: Build the fixture pack twice
        run: |
          cargo run --quiet -p sarnaut-pack -- build --fixture \
            --src data-schemas/demo --out "$RUNNER_TEMP/pack-first"
          cargo run --quiet -p sarnaut-pack -- build --fixture \
            --src data-schemas/demo --out "$RUNNER_TEMP/pack-second"

      - name: Assert the two builds are byte-identical
        run: diff --recursive --brief "$RUNNER_TEMP/pack-first" "$RUNNER_TEMP/pack-second"

      - name: Verify the fixture pack
        run: cargo run --quiet -p sarnaut-pack -- verify "$RUNNER_TEMP/pack-first"

      - name: Assert the fixture carries no untyped passthrough
        run: |
          if grep --quiet '"keep_extra": true' "$RUNNER_TEMP/pack-first/manifest.json"; then
            echo "the fixture pack was built with --keep-extra" >&2
            exit 1
          fi

      # The demo dataset's one overlay layer is `apply_by_default: false`, so
      # the packs above must not carry it and this one must. A layer that
      # switched itself on would move the vendored fixture's digest silently.
      - name: Build the overlaid fixture pack
        run: |
          cargo run --quiet -p sarnaut-pack -- build --fixture \
            --src data-schemas/demo --overlay m2-combat-extended \
            --out "$RUNNER_TEMP/pack-extended"

      - name: Assert the overlay changed the pack and the base did not carry it
        run: |
          python3 - <<'PY'
          import json, os, sys
          temp = os.environ["RUNNER_TEMP"]
          base = json.load(open(f"{temp}/pack-first/manifest.json"))
          extended = json.load(open(f"{temp}/pack-extended/manifest.json"))
          if base["source"]["overlays"]:
              sys.exit(f"the base fixture applied {base['source']['overlays']}")
          if extended["source"]["overlays"] != ["m2-combat-extended"]:
              sys.exit(f"the overlaid fixture applied {extended['source']['overlays']}")
          if base["pack_id"] == extended["pack_id"]:
              sys.exit("applying a layer left pack_id unchanged")
          PY

      # No MY.GAMES type or attribute name may reach a compiled artifact
      # (ADR 0011). The demo dataset is invented, so any hit here is the
      # compiler leaking a source string rather than the data carrying one.
      - name: Assert no source type names reached the table bytes
        run: |
          if grep --recursive --quiet --extended-regexp \
              'gameMechanics|mapLoader|xpointer|\.xdb' \
              "$RUNNER_TEMP/pack-first/tables"; then
            echo "a compiled table carries a source resource path" >&2
            exit 1
          fi
